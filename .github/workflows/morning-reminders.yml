name: Morning cleaner reminders

on:
  schedule:
    # 9 AM ET is 13:00 UTC in summer and 14:00 UTC in winter.
    # Both run; the script only sends on the one that is 9 AM ET today.
    - cron: '5 13 * * *'
    - cron: '5 14 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Send the prompts now for this date (YYYY-MM-DD, blank = today)'
        required: false
        default: ''
      test:
        description: 'Mark the prompts as TEST'
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Send morning reminder prompts to Satoru
        run: node morning-reminders.mjs
        working-directory: scripts
        env:
          SCHEDULE: ${{ github.event.schedule }}
          SEND_NOW: ${{ github.event_name == 'workflow_dispatch' }}
          TEST_MODE: ${{ github.event.inputs.test == 'true' }}
          TEST_DATE: ${{ github.event.inputs.date }}
