name: Auto-assign waitlisted cleaners

on:
  schedule:
    # Run every hour at :15 past the hour (UTC)
    - cron: '15 * * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Run auto-assign
        run: node auto-assign.mjs
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Send test ntfy ping (remove after confirming notifications work)
        run: |
          curl -s -o /dev/null -w "ntfy response: %{http_code}\n" \
            -X POST https://ntfy.sh/bau-cleaning-satoru-7x9k \
            -H "Title: ✅ Auto-assign ran OK" \
            -H "Priority: default" \
            -H "Tags: white_check_mark" \
            -d "Hourly check ran at $(date -u). No new assignments this run."
