<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bau Cleaning">
<title>Bau Guesthaus — Cleaning Scheduler</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,600;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f0e8;
  --paper: #fdfaf4;
  --ink: #1a1610;
  --muted: #7a6f5e;
  --accent: #c8440a;
  --green: #2a6b4a;
  --border: #d4c9b0;
  --claimed: #d4edda;
  --claimed-border: #2a6b4a;
  --unclaimed: #fff3cd;
  --unclaimed-border: #c8440a;
  --mine: #cce5ff;
  --mine-border: #1a6fad;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'DM Mono', monospace;
  min-height: 100vh;
  padding: 1.5rem 1rem 3rem;
}
.container { max-width: 700px; margin: 0 auto; }
h1 {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 1.8rem;
  line-height: 1.1;
  margin-bottom: 0.3rem;
}
h1 span { font-style: italic; color: var(--accent); }
.subtitle { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 1.5rem; }

.card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1.25rem;
  margin-bottom: 1rem;
}
.card-title {
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.9rem;
}

/* Login */
.login-fields { display: flex; flex-direction: column; gap: 0.75rem; }
.login-fields input {
  font-family: 'DM Mono', monospace;
  font-size: 0.95rem;
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 0.6rem 0.75rem;
  background: var(--bg);
  width: 100%;
}
.btn {
  font-family: 'DM Mono', monospace;
  font-size: 0.85rem;
  padding: 0.6rem 1.2rem;
  border: none;
  border-radius: 3px;
  cursor: pointer;
  letter-spacing: 0.03em;
}
.btn-primary { background: var(--accent); color: white; }
.btn-green { background: var(--green); color: white; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--ink); }
.btn:disabled { opacity: 0.4; cursor: default; }

.status { font-size: 0.78rem; margin-top: 0.5rem; }
.status.error { color: var(--accent); }
.status.ok { color: var(--green); }

/* User bar */
#user-bar {
  display: none;
  align-items: center;
  justify-content: space-between;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.6rem 1rem;
  margin-bottom: 1rem;
  font-size: 0.8rem;
}
#user-bar .name { font-weight: 500; }
#user-bar .role { color: var(--muted); font-size: 0.7rem; margin-left: 0.5rem; }

/* Schedule */
.day-block {
  border: 1px solid var(--border);
  border-radius: 4px;
  margin-bottom: 0.75rem;
  overflow: hidden;
}
.day-header {
  background: var(--bg);
  padding: 0.5rem 0.9rem;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
}
.day-header .no-clean {
  font-size: 0.65rem;
  color: var(--muted);
  font-style: italic;
}
.slots { padding: 0.5rem 0.9rem; display: flex; flex-direction: column; gap: 0.4rem; }
.slot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.5rem 0.75rem;
  border-radius: 3px;
  font-size: 0.82rem;
  border: 1px solid transparent;
}
.slot.unclaimed {
  background: var(--unclaimed);
  border-color: #e0c060;
}
.slot.claimed-other {
  background: var(--claimed);
  border-color: var(--claimed-border);
  opacity: 0.75;
}
.slot.claimed-mine {
  background: var(--mine);
  border-color: var(--mine-border);
}
.slot-unit { font-weight: 500; min-width: 2rem; }
.slot-label { flex: 1; padding: 0 0.75rem; color: var(--muted); font-size: 0.75rem; }
.slot-claimer { font-size: 0.75rem; color: var(--green); }
.slot-claimer.mine { color: var(--mine-border); }
.claim-btn {
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  padding: 0.3rem 0.7rem;
  border-radius: 3px;
  border: 1px solid;
  cursor: pointer;
  white-space: nowrap;
}
.claim-btn.claim { background: var(--green); color: white; border-color: var(--green); }
.claim-btn.unclaim { background: white; color: var(--mine-border); border-color: var(--mine-border); }

/* Admin */
.admin-slot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.4rem 0.75rem;
  border-radius: 3px;
  font-size: 0.8rem;
  border: 1px solid transparent;
  margin-bottom: 0.3rem;
}
.admin-slot.unclaimed { background: var(--unclaimed); border-color: #e0c060; }
.admin-slot.claimed { background: var(--claimed); border-color: var(--claimed-border); }
.admin-remove { font-size: 0.65rem; color: var(--accent); cursor: pointer; text-decoration: underline; background: none; border: none; font-family: inherit; }

/* Loading */
.loading { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.8rem; }
.spinner {
  display: inline-block; width: 16px; height: 16px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.7s linear infinite;
  margin-right: 0.5rem; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Tabs */
.tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.tab {
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  padding: 0.4rem 0.9rem;
  border: 1px solid var(--border);
  border-radius: 3px;
  cursor: pointer;
  background: var(--paper);
  color: var(--muted);
}
.tab.active { background: var(--ink); color: white; border-color: var(--ink); }

.legend { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.7rem; color: var(--muted); }
.legend-dot { width: 10px; height: 10px; border-radius: 2px; }

#app { display: none; }

/* Bottom nav */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--paper);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0.6rem 0.5rem 0.8rem;
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  border: none;
  background: none;
  cursor: pointer;
  gap: 0.2rem;
}
.nav-btn .nav-icon { font-size: 1.3rem; line-height: 1; }
.nav-btn.active { color: var(--accent); }
body { padding-bottom: 5rem; }

/* Next-clean banner */
.next-clean-card {
  background: var(--ink);
  color: white;
  border-radius: 4px;
  padding: 1.25rem;
  margin-bottom: 1rem;
}
.next-clean-label {
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
  margin-bottom: 0.4rem;
}
.next-clean-date {
  font-family: 'Fraunces', serif;
  font-size: 1.5rem;
  font-weight: 300;
  font-style: italic;
  line-height: 1.1;
  margin-bottom: 0.3rem;
}
.next-clean-unit {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.75);
}
.next-clean-card .open-checklist {
  margin-top: 1rem;
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  padding: 0.5rem 1rem;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 3px;
  color: white;
  cursor: pointer;
  letter-spacing: 0.03em;
}

/* Checklist modal */
.checklist-screen {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 200;
  overflow-y: auto;
}
.checklist-header {
  background: var(--paper);
  border-bottom: 1px solid var(--border);
  padding: 1rem 1rem 0;
  position: sticky;
  top: 0;
  z-index: 10;
}
.checklist-header-top {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 0.75rem;
}
.back-btn {
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  color: var(--muted);
  border: none;
  background: none;
  cursor: pointer;
  padding: 0.3rem 0;
}
.checklist-title {
  font-family: 'Fraunces', serif;
  font-size: 1.1rem;
  font-weight: 600;
}
.checklist-subtitle {
  font-size: 0.7rem;
  color: var(--muted);
  flex: 1;
}

/* Progress bar */
.progress-bar-wrap {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 0;
}
.progress-bar-fill {
  height: 100%;
  background: var(--green);
  border-radius: 2px;
  transition: width 0.3s ease;
}

/* Room tabs */
.room-tabs {
  display: flex;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
  margin-top: 0.75rem;
}
.room-tabs::-webkit-scrollbar { display: none; }
.room-tab {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 0.5rem 0.9rem;
  border: none;
  background: none;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.room-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* Checklist body */
.checklist-body { padding: 1rem; }
.room-photo {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  border-radius: 4px;
  border: 1px solid var(--border);
  margin-bottom: 1rem;
  background: var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 0.75rem;
}
.room-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 3px;
}
.checklist-items { display: flex; flex-direction: column; gap: 0; }
.checklist-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.checklist-item:last-child { border-bottom: none; }
.check-box {
  width: 22px; height: 22px;
  border: 2px solid var(--border);
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  transition: all 0.15s;
}
.checklist-item.done .check-box {
  background: var(--green);
  border-color: var(--green);
  color: white;
}
.check-label {
  font-size: 0.85rem;
  flex: 1;
}
.checklist-item.done .check-label {
  text-decoration: line-through;
  color: var(--muted);
}

/* Completion screen */
.complete-screen {
  display: none;
  text-align: center;
  padding: 3rem 1.5rem;
}
.complete-icon { font-size: 3.5rem; margin-bottom: 1rem; }
.complete-title {
  font-family: 'Fraunces', serif;
  font-size: 1.8rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
}
.complete-sub { color: var(--muted); font-size: 0.8rem; margin-bottom: 2rem; }
</style>
</head>
<body>
<!-- Checklist screen (full-screen overlay) -->
<div class="checklist-screen" id="checklist-screen">
  <div class="checklist-header">
    <div class="checklist-header-top">
      <button class="back-btn" onclick="closeChecklist()">← Back</button>
      <div>
        <div class="checklist-title" id="cl-title">Unit C</div>
        <div class="checklist-subtitle" id="cl-date"></div>
      </div>
      <div style="font-size:0.72rem;color:var(--muted);" id="cl-progress-text">0 / 0</div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="cl-progress-bar" style="width:0%"></div>
    </div>
    <div class="room-tabs" id="cl-room-tabs"></div>
  </div>

  <div class="checklist-body" id="cl-body">
    <!-- room content injected here -->

    <button class="btn btn-green" style="width:100%;font-size:0.9rem;padding:0.75rem;" onclick="notifyOwner()" id="notify-btn">
      Notify Satoru — Unit Ready
    </button>
    <button class="btn btn-ghost" style="width:100%;margin-top:0.75rem;font-size:0.8rem;" onclick="closeChecklist()">Back to schedule</button>
  </div>
</div>

<div class="container">
  <header>
    <h1>Bau Guesthaus<br><span>Cleaning</span></h1>
  </header>

  <!-- Login -->
  <div id="login-card" class="card" style="display:none;">
    <div class="card-title">Sign In</div>
    <div class="login-fields">
      <input type="text" id="login-name" placeholder="Your name" autocomplete="name" />
      <input type="password" id="login-pin" placeholder="PIN" inputmode="numeric" maxlength="6" />
    </div>
    <button class="btn btn-primary" style="margin-top:0.75rem;width:100%;" onclick="login()">Sign In</button>
    <div class="status" id="login-status"></div>
  </div>

  <!-- User bar -->
  <div id="user-bar">
    <div><span class="name" id="bar-name"></span><span class="role" id="bar-role"></span></div>
    <button class="btn btn-ghost" style="font-size:0.72rem;padding:0.3rem 0.7rem;" onclick="logout()">Sign out</button>
  </div>

  <!-- Main app -->
  <div id="app">
    <!-- Cleaner view -->
    <div id="cleaner-view">

      <!-- Home tab -->
      <div id="tab-home">
        <div id="next-clean-area"></div>
        <div class="card" style="margin-top:0.5rem;">
          <div class="card-title">Your upcoming cleans</div>
          <div id="my-claims-list" style="font-size:0.82rem;color:var(--muted);">Loading...</div>
        </div>
      </div>

      <!-- Schedule tab -->
      <div id="tab-schedule" style="display:none;">
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--unclaimed);border:1px solid #e0c060;"></div> Available</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--mine);border:1px solid var(--mine-border);"></div> Your claim</div>
        </div>
        <div id="schedule-loading" class="loading"><span class="spinner"></span>Loading schedule...</div>
        <div id="schedule-container"></div>
      </div>
    </div>

    <!-- Admin view -->
    <div id="admin-view" style="display:none;">
      <div class="tabs">
        <button class="tab active" onclick="showAdminTab('overview')">Overview</button>
        <button class="tab" onclick="showAdminTab('cleaners')">Manage Cleaners</button>
      </div>

      <div id="admin-overview">
        <div id="admin-loading" class="loading"><span class="spinner"></span>Loading...</div>
        <div id="admin-schedule"></div>
      </div>

      <div id="admin-cleaners" style="display:none;">
        <div class="card">
          <div class="card-title">Add Cleaner</div>
          <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
            <input type="text" id="new-cleaner-name" placeholder="Name" style="font-family:'DM Mono',monospace;font-size:0.85rem;border:1px solid var(--border);border-radius:3px;padding:0.5rem 0.75rem;background:var(--bg);flex:1;min-width:120px;" />
            <input type="password" id="new-cleaner-pin" placeholder="PIN (4-6 digits)" inputmode="numeric" maxlength="6" style="font-family:'DM Mono',monospace;font-size:0.85rem;border:1px solid var(--border);border-radius:3px;padding:0.5rem 0.75rem;background:var(--bg);width:160px;" />
            <button class="btn btn-green" onclick="addCleaner()">Add</button>
          </div>
          <div class="status" id="add-cleaner-status"></div>
        </div>
        <div class="card">
          <div class="card-title">Current Cleaners</div>
          <div id="cleaners-list"><span style="color:var(--muted);font-size:0.8rem;">Loading...</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bottom nav (cleaner only) -->
<nav class="bottom-nav" id="bottom-nav" style="display:none;">
  <button class="nav-btn active" id="nav-home" onclick="switchTab('home')">
    <span class="nav-icon">🏠</span>Home
  </button>
  <button class="nav-btn" id="nav-schedule" onclick="switchTab('schedule')">
    <span class="nav-icon">📅</span>Schedule
  </button>
</nav>

<script type="module">
// ── Firebase config ───────────────────────────────────────
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDuX4TVEewvrrwJqttBESb0AOf6gbJYkKs",
  authDomain: "bau-guesthaus-cleaning.firebaseapp.com",
  projectId: "bau-guesthaus-cleaning",
  storageBucket: "bau-guesthaus-cleaning.firebasestorage.app",
  messagingSenderId: "899961946120",
  appId: "1:899961946120:web:c08c59b29be4d9d42911bd"
};

const ADMIN_PINS = { '7553': 'Satoru', '1225': 'Atsuko' };

let db, currentUser = null;

async function initFirebase(config) {
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js');
  const { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, onSnapshot, query, where }
    = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js');

  const app = initializeApp(config);
  db = getFirestore(app);
  window._fb = { doc, getDoc, setDoc, deleteDoc, collection, onSnapshot, query, where };
  return true;
}

// ── Boot ─────────────────────────────────────────────────
async function bootApp() {
  try {
    await initFirebase(FIREBASE_CONFIG);
    document.getElementById('login-card').style.display = 'block';
  } catch(e) {
    console.error('Firebase error:', e);
    document.body.insertAdjacentHTML('afterbegin',
      `<div style="background:#c8440a;color:white;padding:1rem;font-family:monospace;font-size:0.8rem;">
        Firebase error: ${e.message}
      </div>`);
  }
}

// ── Login ─────────────────────────────────────────────────
window.login = async function() {
  const name = document.getElementById('login-name').value.trim();
  const pin  = document.getElementById('login-pin').value.trim();
  const statusEl = document.getElementById('login-status');
  if (!name || !pin) { statusEl.textContent = 'Enter name and PIN.'; statusEl.className='status error'; return; }

  // Admin check
  if (ADMIN_PINS[pin]) {
    currentUser = { name: ADMIN_PINS[pin], role: 'admin' };
    showApp();
    return;
  }

  // Cleaner check
  const { doc, getDoc } = window._fb;
  const snap = await getDoc(doc(db, 'cleaners', name.toLowerCase()));
  if (!snap.exists() || snap.data().pin !== pin) {
    statusEl.textContent = 'Name or PIN not recognized.';
    statusEl.className = 'status error';
    return;
  }
  currentUser = { name: snap.data().name, role: 'cleaner' };
  showApp();
};

window.logout = function() {
  currentUser = null;
  document.getElementById('user-bar').style.display = 'none';
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-card').style.display = 'block';
  document.getElementById('login-pin').value = '';
};

function showApp() {
  document.getElementById('login-card').style.display = 'none';
  const bar = document.getElementById('user-bar');
  bar.style.display = 'flex';
  document.getElementById('bar-name').textContent = currentUser.name;
  document.getElementById('bar-role').textContent = currentUser.role === 'admin' ? ' · Admin' : ' · Cleaner';
  document.getElementById('app').style.display = 'block';

  if (currentUser.role === 'admin') {
    document.getElementById('cleaner-view').style.display = 'none';
    document.getElementById('admin-view').style.display = 'block';
    document.getElementById('bottom-nav').style.display = 'none';
    loadAdminSchedule();
    loadCleanersList();
  } else {
    document.getElementById('cleaner-view').style.display = 'block';
    document.getElementById('admin-view').style.display = 'none';
    document.getElementById('bottom-nav').style.display = 'flex';
    switchTab('home');
    loadCleanerSchedule();
  }
}

// ── iCal / Schedule ──────────────────────────────────────
const WORKER = 'https://green-poetry-6240.satoru185.workers.dev/';
const UNITS = ['A','B','C','F','E'];

async function fetchICal(unit) {
  const res = await fetch(`${WORKER}?unit=${unit}&_=${Date.now()}`, { cache: 'no-store' });
  return res.text();
}

function parseICal(text) {
  const events = [];
  const blocks = text.split('BEGIN:VEVENT');
  for (let i = 1; i < blocks.length; i++) {
    const b = blocks[i];
    const startM = b.match(/DTSTART(?:;VALUE=DATE)?:(\d{8})/);
    const endM   = b.match(/DTEND(?:;VALUE=DATE)?:(\d{8})/);
    const sumM   = b.match(/SUMMARY:(.+)/);
    if (!startM || !endM) continue;
    const summary = sumM ? sumM[1].trim() : '';
    if (/not available/i.test(summary)) continue;
    const start = parseDate(startM[1]);
    const end   = parseDate(endM[1]);
    events.push({ start, end });
  }
  return events;
}

function parseDate(s) {
  const d = new Date(+s.slice(0,4), +s.slice(4,6)-1, +s.slice(6,8));
  d.setHours(0,0,0,0);
  return d;
}

function sameDay(a, b) {
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

function classifyDay(events, day) {
  let result = null;
  for (const ev of events) {
    if (sameDay(ev.end, day))   result = result==='checkin' ? 'both' : 'checkout';
    else if (sameDay(ev.start, day)) result = result==='checkout' ? 'both' : 'checkin';
    else if (ev.start < day && ev.end > day && !result) result = 'ongoing';
  }
  return result;
}

function getDays(n=14) {
  const days = [];
  const start = new Date(); start.setHours(0,0,0,0);
  for (let i = 0; i < n; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    days.push(d);
  }
  return days;
}

function dayKey(d) {
  return d.toISOString().slice(0,10); // YYYY-MM-DD
}

function slotKey(date, unit) {
  return `${dayKey(date)}_${unit}`;
}

function formatDay(d) {
  return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
}

// Get checkout slots for each day
function getNights(events, day) {
  // Find the booking that checks out on this day, return number of nights
  for (const ev of events) {
    if (sameDay(ev.end, day)) {
      const nights = Math.round((ev.end - ev.start) / (1000 * 60 * 60 * 24));
      return nights;
    }
  }
  return null;
}

async function getCheckoutSlots() {
  const icals = {};
  await Promise.all(UNITS.map(async u => {
    try { icals[u] = parseICal(await fetchICal(u)); } catch { icals[u] = []; }
  }));

  const days = getDays(14);
  const result = [];

  for (const day of days) {
    const checkouts = [];  // array of {unit, nights}
    const eStatus = classifyDay(icals['E']||[], day);
    const eNights = getNights(icals['E']||[], day);

    for (const u of ['A','B','C','F']) {
      const s = classifyDay(icals[u]||[], day);
      if (s==='checkout'||s==='both') {
        checkouts.push({ unit: u, nights: getNights(icals[u]||[], day) });
      }
    }
    if (eStatus==='checkout'||eStatus==='both') {
      if (!checkouts.find(c=>c.unit==='A')) checkouts.push({ unit: 'A', nights: eNights });
      if (!checkouts.find(c=>c.unit==='B')) checkouts.push({ unit: 'B', nights: eNights });
    }

    checkouts.sort((a,b) => a.unit.localeCompare(b.unit));
    result.push({ day, checkouts });
  }
  return result;
}

// ── Cleaner view ─────────────────────────────────────────
async function loadCleanerSchedule() {
  const container = document.getElementById('schedule-container');
  const loading = document.getElementById('schedule-loading');
  container.innerHTML = '';

  const slots = await getCheckoutSlots();
  loading.style.display = 'none';

  const { collection, onSnapshot } = window._fb;
  // Listen for real-time claim updates
  onSnapshot(collection(db, 'claims'), snap => {
    const claims = {};
    snap.forEach(d => { claims[d.id] = d.data(); });
    renderCleanerSchedule(slots, claims, container);
    renderHomeTab(slots, claims);
  });
}

function renderCleanerSchedule(slots, claims, container) {
  container.innerHTML = '';
  for (const { day, checkouts } of slots) {
    // Only show slots that are unclaimed or claimed by me
    const visibleSlots = checkouts.filter(({unit}) => {
      const claim = claims[slotKey(day, unit)];
      return !claim || claim.cleaner === currentUser.name;
    });

    const block = document.createElement('div');
    block.className = 'day-block';

    const header = document.createElement('div');
    header.className = 'day-header';
    header.innerHTML = `<span>${formatDay(day)}</span>${visibleSlots.length===0 ? '<span class="no-clean">No available slots</span>' : ''}`;
    block.appendChild(header);

    if (visibleSlots.length > 0) {
      const slotsDiv = document.createElement('div');
      slotsDiv.className = 'slots';

      for (const {unit, nights} of visibleSlots) {
        const key = slotKey(day, unit);
        const claim = claims[key];
        const isMe = claim && claim.cleaner === currentUser.name;
        const nightLabel = nights ? `${nights} night${nights===1?'':'s'}` : '';

        const slotEl = document.createElement('div');
        slotEl.className = `slot ${isMe ? 'claimed-mine' : 'unclaimed'}`;

        let rightSide = isMe
          ? `<span class="slot-claimer mine">✓ Claimed</span>
             <button class="claim-btn unclaim" onclick="unclaim('${key}')">Release</button>`
          : `<button class="claim-btn claim" onclick="claimSlot('${key}', '${dayKey(day)}', '${unit}')">Claim</button>`;

        slotEl.innerHTML = `<span class="slot-unit">Unit ${unit}</span>
          <span class="slot-label">${nightLabel}</span>
          ${rightSide}`;
        slotsDiv.appendChild(slotEl);
      }
      block.appendChild(slotsDiv);
    }
    container.appendChild(block);
  }
}

window.claimSlot = async function(key, date, unit) {
  const { doc, setDoc } = window._fb;
  await setDoc(doc(db, 'claims', key), {
    cleaner: currentUser.name,
    date, unit,
    claimedAt: new Date().toISOString()
  });
};

window.unclaim = async function(key) {
  const { doc, deleteDoc, getDoc } = window._fb;
  const snap = await getDoc(doc(db, 'claims', key));
  if (snap.exists() && snap.data().cleaner === currentUser.name) {
    await deleteDoc(doc(db, 'claims', key));
  }
};

async function loadAdminSchedule() {

  adminSlots = await getCheckoutSlots();

  });

  onSnapshot(collection(db, 'claims'), snap => {

    snap.forEach(d => { claims[d.id] = d.data(); });

function renderAdminSchedule(slots, claims, container) {
  container.innerHTML = '';

  let totalSlots = 0, claimedCount = 0;
  for (const { checkouts } of slots) { totalSlots += checkouts.length; }
  for (const k of Object.keys(claims)) { claimedCount++; }

  const summary = document.createElement('div');
  summary.className = 'card';
  summary.innerHTML = `<div class="card-title">Summary</div>
    <div style="font-size:0.85rem;">
      <span style="color:var(--green);">✓ ${claimedCount} claimed</span> &nbsp;·&nbsp;
      <span style="color:var(--accent);">○ ${totalSlots-claimedCount} unclaimed</span> &nbsp;·&nbsp;
      ${totalSlots} total slots
    </div>`;
  container.appendChild(summary);

  for (const { day, checkouts } of slots) {
    if (checkouts.length === 0) continue;
    const block = document.createElement('div');
    block.className = 'day-block';

    const header = document.createElement('div');
    header.className = 'day-header';
    header.textContent = formatDay(day);
    block.appendChild(header);

    const slotsDiv = document.createElement('div');
    slotsDiv.className = 'slots';

    for (const {unit, nights} of checkouts) {
      const key = slotKey(day, unit);
      const claim = claims[key];
      const nightLabel = nights ? `${nights}n` : '';
      const slotEl = document.createElement('div');
      slotEl.className = `admin-slot ${claim ? 'claimed' : 'unclaimed'}`;

      const options = adminCleanerNames.map(n =>
        `<option value="${n}" ${claim && claim.cleaner===n ? 'selected' : ''}>${n}</option>`
      ).join('');

      slotEl.innerHTML = `
        <span style="font-weight:500;min-width:4rem;">Unit ${unit}</span>
        <span style="font-size:0.72rem;color:var(--muted);min-width:2.5rem;">${nightLabel}</span>
        <span style="flex:1;padding:0 0.5rem;font-size:0.75rem;color:var(--muted);">Checkout</span>
        ${claim
          ? `<span style="font-size:0.78rem;color:var(--green);margin-right:0.5rem;">✓ ${claim.cleaner}</span>
             <button class="admin-remove" onclick="adminRemove('${key}')">Remove</button>`
          : adminCleanerNames.length > 0
            ? `<select onchange="adminAssign('${key}','${dayKey(day)}','${unit}',this.value)"
                style="font-family:'DM Mono',monospace;font-size:0.75rem;padding:0.25rem 0.4rem;border:1px solid var(--border);border-radius:3px;background:var(--bg);cursor:pointer;">
                <option value="">Assign cleaner…</option>
                ${options}
              </select>`
            : `<span style="font-size:0.75rem;color:var(--muted);">No cleaners added</span>`
        }
      `;
      slotsDiv.appendChild(slotEl);
    }
    block.appendChild(slotsDiv);
    container.appendChild(block);
  }
}

// ── Home tab: next clean & my claims ──────────────────────
function renderHomeTab(slots, claims) {
  const mySlots = [];
  for (const { day, checkouts } of slots) {
    for (const { unit, nights } of checkouts) {
      const key = slotKey(day, unit);
      if (claims[key] && claims[key].cleaner === currentUser.name) {
        mySlots.push({ day, unit, nights, key });
      }
    }
  }

  // Next clean banner
  const area = document.getElementById('next-clean-area');
  area.innerHTML = '';
  if (mySlots.length === 0) {
    area.innerHTML = `<div class="card"><div style="color:var(--muted);font-size:0.85rem;">No upcoming cleans claimed yet. Go to Schedule to claim a slot.</div></div>`;
  } else {
    const { day, unit, nights } = mySlots[0];
    const isToday = sameDay(day, new Date());
    const dateLabel = isToday ? 'Today' : formatDay(day);
    const nightLabel = nights ? ` · ${nights} night${nights===1?'':'s'}` : '';
    area.innerHTML = `
      <div class="next-clean-card">
        <div class="next-clean-label">Your next clean</div>
        <div class="next-clean-date">${dateLabel}</div>
        <div class="next-clean-unit">Unit ${unit}${nightLabel}</div>
        <button class="open-checklist" onclick="openChecklist('${unit}','${dayKey(day)}','${nights||0}')">
          Open cleaning checklist →
        </button>
      </div>`;
  }

  // My claims list
  const list = document.getElementById('my-claims-list');
  if (mySlots.length === 0) {
    list.textContent = 'None claimed yet.';
    return;
  }
  list.innerHTML = '';
  for (const { day, unit, nights } of mySlots) {
    const isToday = sameDay(day, new Date());
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid var(--border);';
    const dateLabel = isToday ? '<span style="color:var(--accent);font-weight:500;">Today</span>' : formatDay(day);
    const nightLabel = nights ? `<span style="color:var(--muted);font-size:0.72rem;"> · ${nights}n</span>` : '';
    row.innerHTML = `<span>${dateLabel} — Unit ${unit}${nightLabel}</span>
      <button style="font-family:\'DM Mono\',monospace;font-size:0.68rem;padding:0.25rem 0.6rem;border:1px solid var(--border);border-radius:3px;background:var(--paper);cursor:pointer;" onclick="openChecklist('${unit}','${dayKey(day)}','${nights||0}')">Checklist</button>`;
    list.appendChild(row);
  }
}

// Checklist state
let clState = { unit: null, date: null, nights: 0, roomIndex: 0, checked: {} };

window.openChecklist = function(unit, date, nights) {
  clState = { unit, date, nights: parseInt(nights)||0, roomIndex: 0, checked: {} };
  document.getElementById('cl-title').textContent = `Unit ${unit}`;
  document.getElementById('cl-date').textContent = date + (clState.nights ? ` · ${clState.nights} night${clState.nights===1?'':'s'}` : '');
  document.getElementById('complete-screen').style.display = 'none';
  document.getElementById('cl-body').style.display = 'block';
  buildRoomTabs(unit);
  renderRoom(unit, 0);
  document.getElementById('checklist-screen').style.display = 'block';
  window.scrollTo(0,0);
};

window.closeChecklist = function() {
  document.getElementById('checklist-screen').style.display = 'none';
};

function buildRoomTabs(unit) {
  const rooms = (UNIT_CHECKLISTS[unit] || UNIT_CHECKLISTS.A).rooms;
  const wrap = document.getElementById('cl-room-tabs');
  wrap.innerHTML = '';
  rooms.forEach((r, i) => {
    const btn = document.createElement('button');
    btn.className = 'room-tab' + (i===0?' active':'');
    btn.textContent = r.name;
    btn.onclick = () => { clState.roomIndex = i; renderRoom(unit, i); };
    wrap.appendChild(btn);
  });
}

function renderRoom(unit, idx) {
  // Update tab active state
  document.querySelectorAll('.room-tab').forEach((t,i) => t.classList.toggle('active', i===idx));

  const rooms = (UNIT_CHECKLISTS[unit] || UNIT_CHECKLISTS.A).rooms;
  const room = rooms[idx];
  const body = document.getElementById('cl-body');

  // Photo area
  const photoHtml = room.photo
    ? `<div class="room-photo"><img src="${room.photo}" alt="${room.name}"></div>`
    : `<div class="room-photo" style="display:flex;align-items:center;justify-content:center;min-height:180px;">
         <span style="color:var(--muted);font-size:0.78rem;">📷 Photo coming soon</span>
       </div>`;

  // Checklist items
  const itemsHtml = room.items.map((item, j) => {
    const ck = clState.checked[`${idx}-${j}`];
    return `<div class="checklist-item ${ck?'done':''}" onclick="toggleCheck(${idx},${j})">
      <div class="check-box">${ck?'✓':''}</div>
      <span class="check-label">${item}</span>
    </div>`;
  }).join('');

  body.innerHTML = `${photoHtml}<div class="checklist-items">${itemsHtml}</div>`;
  updateProgress(unit);
}

window.toggleCheck = function(roomIdx, itemIdx) {
  const key = `${roomIdx}-${itemIdx}`;
  clState.checked[key] = !clState.checked[key];
  renderRoom(clState.unit, roomIdx);
};

function updateProgress(unit) {
  const rooms = (UNIT_CHECKLISTS[unit] || UNIT_CHECKLISTS.A).rooms;
  let total = 0, done = 0;
  rooms.forEach((r, ri) => {
    r.items.forEach((_, ji) => {
      total++;
      if (clState.checked[`${ri}-${ji}`]) done++;
    });
  });
  const pct = total > 0 ? Math.round(done/total*100) : 0;
  document.getElementById('cl-progress-bar').style.width = pct + '%';
  document.getElementById('cl-progress-text').textContent = `${done} / ${total}`;

  if (done === total && total > 0) {
    setTimeout(() => {
      document.getElementById('cl-body').style.display = 'none';
      const sub = document.getElementById('complete-sub');
      sub.textContent = `Unit ${clState.unit} is clean and ready for check-in.`;
      document.getElementById('notify-btn').textContent = `Notify Satoru — Unit ${clState.unit} Ready`;
      document.getElementById('complete-screen').style.display = 'block';
    }, 400);
  }
}

  const msg = encodeURIComponent(`✅ Unit ${clState.unit} is clean and ready for check-in! (${clState.date})`);
  window.location.href = `sms:${OWNER_PHONE}&body=${msg}`;
};
